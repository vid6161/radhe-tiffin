<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radhe Tiffin — Business Settings</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"><style>body{background:#fffaf2;color:#2d241e}.wrap{max-width:1050px;margin:40px auto;padding:0 22px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.card{background:#fff;border:1px solid #e7dfd4;border-radius:20px;padding:24px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}.field input,.field textarea{width:100%;box-sizing:border-box;border:1px solid #ddd3ca;border-radius:10px;padding:11px}.field textarea{min-height:90px}.wide{grid-column:1/-1}.btn{border:0;border-radius:999px;padding:12px 20px;background:#2d241e;color:white;font-weight:800}.links a{margin-left:12px;color:#bd6200;text-decoration:none;font-weight:700}.flash{padding:12px;border-radius:10px;background:#eaf6ec;margin-bottom:12px}.flash.error{background:#fce8e6}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div class="wrap"><div class="head"><div><div class="eyebrow">RADHE TIFFIN</div><h1>Business Settings</h1><p>Complete these details before production launch.</p></div><div class="links"><a href="/admin">Dashboard</a><a href="/admin/finance">Finance</a></div></div>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><div class="card"><h2>Business identity</h2><div class="grid"><div class="field"><label>Business name *</label><input name="business_name" value="{{settings.business_name}}" required></div><div class="field"><label>Legal name</label><input name="legal_name" value="{{settings.legal_name}}"></div><div class="field"><label>Owner / responsible person</label><input name="owner_name" value="{{settings.owner_name}}"></div><div class="field"><label>Website</label><input name="website" value="{{settings.website}}"></div><div class="field"><label>Business address(es)</label><input name="address" value="{{settings.address}}"></div><div class="field"><label>City / cities</label><input name="city" value="{{settings.city}}"></div><div class="field"><label>Postal code(s)</label><input name="postal_code" value="{{settings.postal_code}}"></div><div class="field"><label>Country</label><input name="country" value="{{settings.country}}"></div><div class="field"><label>Email</label><input type="email" name="email" value="{{settings.email}}"></div><div class="field"><label>Phone</label><input name="phone" value="{{settings.phone}}"></div><div class="field"><label>VAT ID</label><input name="vat_id" value="{{settings.vat_id}}"></div><div class="field"><label>Tax number</label><input name="tax_number" value="{{settings.tax_number}}"></div></div></div><div class="card"><h2>Customer-facing policies</h2><div class="grid"><div class="field wide"><label>Pickup policy</label><textarea name="pickup_policy">{{settings.pickup_policy}}</textarea></div><div class="field wide"><label>Cancellation / no-show policy</label><textarea name="cancellation_policy">{{settings.cancellation_policy}}</textarea></div><div class="field wide"><label>Allergy notice</label><textarea name="allergy_notice">{{settings.allergy_notice}}</textarea></div></div></div><button class="btn">Save business settings</button></form></div></body></html>
